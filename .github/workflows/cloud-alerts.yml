name: SEPA/VCP Alertas Cloud 24/7

on:
  schedule:
    # Briefing Matinal (Seg-Sex, 13:45 UTC — antes da abertura da bolsa EUA)
    - cron: '45 13 * * 1-5'
    # A cada 30 min durante sessão EUA (Seg-Sex, 14:00-21:30 UTC): alertas de preço + macro + IBD
    - cron: '*/30 14-21 * * 1-5'
    # A cada 4 horas (24/7): scan completo Multi-Estratégia (VCP, Pocket Pivot, EP, Cripto Funding)
    - cron: '0 */4 * * *'
    # Resumo Semanal de Domingo (18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de verificação'
        required: true
        default: 'morning'
        type: choice
        options:
          - alerts
          - full
          - morning
          - weekly
      send_test_ping:
        description: 'Enviar mensagem de teste no Telegram/Discord'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sepa-vcp-cloud-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 com cache pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-cloud.txt'

      - name: Instalar dependências leves
        run: pip install -r backend/requirements-cloud.txt

      - name: Executar Monitor SEPA/VCP (Alertas + Briefing + Multi-Estratégia)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_PROVIDER: none
          SCHEDULER_ENABLED: 'false'
        run: |
          MODE="alerts"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "45 13 * * 1-5" ]; then
            MODE="morning"
          elif [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then
            MODE="weekly"
          elif [ "${{ github.event.schedule }}" = "0 */4 * * *" ]; then
            MODE="full"
          fi

          EXTRA=""
          if [ "${{ github.event.inputs.send_test_ping }}" = "true" ]; then
            EXTRA="--test-ping"
          fi

          echo "A executar cloud_monitor em modo: $MODE $EXTRA"
          python backend/cloud_monitor.py --mode "$MODE" $EXTRA

      - name: Guardar estado para evitar alertas duplicados
        run: |
          git config user.name "sepa-vcp-bot"
          git config user.email "sepa-vcp-bot@users.noreply.github.com"
          git add cloud_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud): atualizar estado de alertas [skip ci]"
            git push
          else
            echo "Sem alterações em cloud_state.json."
          fi
