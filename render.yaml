services:
  - type: web
    name: sepa-vcp-trading-terminal
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DEFAULT_CAPITAL_EUR
        value: "100.0"
      - key: DEFAULT_STOP_LOSS_PCT
        value: "6.0"
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
